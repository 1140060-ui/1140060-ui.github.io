<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡表單測試</title>
  <!-- 防範 favicon.ico 404 報錯 -->
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .form-container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }
    .test-panel {
      margin-top: 25px;
      border-top: 1px solid #444;
      padding-top: 20px;
    }
    .test-panel input {
      margin-bottom: 15px;
    }
    #testBtn {
      background: #28a745;
    }
    #testBtn:hover {
      background: #1e7e34;
    }
    .status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
      font-size: 0.9rem;
      text-align: center;
    }
    .status-msg.success {
      background-color: #1e4620;
      color: #75b798;
    }
    .status-msg.error {
      background-color: #491217;
      color: #ea868f;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>聯絡我們</h2>
    
    <!-- 一般聯絡表單 -->
    <form id="contactForm">
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" required placeholder="請輸入姓名">
      </div>

      <div class="form-group">
        <label for="email">電子郵件</label>
        <input type="email" id="email" name="email" required placeholder="請輸入 Email">
      </div>

      <div class="form-group">
        <label for="message">訊息內容</label>
        <textarea id="message" name="message" rows="4" required placeholder="請輸入您的訊息..."></textarea>
      </div>

      <button type="submit" id="submitBtn">確認送出</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>

    <!-- JS 測試區塊 -->
    <div class="test-panel">
      <label for="count">批量測試發送次數 (建議 1~3 次)</label>
      <input type="number" id="count" value="1" min="1" max="20">

      <button type="button" id="testBtn" onclick="sendTest()">
        開始自動測試
      </button>
    </div>
  </div>

<script>
// 🔑 請在此處填入您複製到的 Access Key
const ACCESS_KEY = "81b74347-9220-48a3-81da-28620c7ef4d6"; 
const TEST_EMAIL = "1140060@gm.yhh.tn.edu.tw";

// 1. 處理手動填寫表單送出
document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault(); // 阻止傳統網頁跳轉

  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("statusMsg");
  
  submitBtn.disabled = true;
  submitBtn.innerText = "傳送中...";
  statusMsg.style.display = "none";

  const payload = {
    access_key: ACCESS_KEY,
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    message: document.getElementById("message").value
  };

  try {
    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (response.ok && result.success) {
      statusMsg.className = "status-msg success";
      statusMsg.innerText = "🎉 訊息發送成功！我們將盡快回覆您。";
      document.getElementById("contactForm").reset();
    } else {
      statusMsg.className = "status-msg error";
      statusMsg.innerText = "❌ 發送失敗：" + (result.message || "請檢查 Key 是否正確");
    }
  } catch (err) {
    statusMsg.className = "status-msg error";
    statusMsg.innerText = "⚠️ 網路連線錯誤，請稍後再試。";
    console.error("發送出錯:", err);
  } finally {
    statusMsg.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.innerText = "確認送出";
  }
});

// 2. 批量自動測試功能
async function sendTest() {
  const countInput = document.getElementById("count");
  const testBtn = document.getElementById("testBtn");
  const times = parseInt(countInput.value, 10);

  if (ACCESS_KEY === "81b74347-9220-48a3-81da-28620c7ef4d6") {
    alert("請先在 JavaScript 程式碼中將 ACCESS_KEY 替換成您的真實 Key！");
    return;
  }

  if (isNaN(times) || times < 1 || times > 0.1) {
    alert("請輸入 1～5 之間的數字（避免觸發發送頻率限制）");
    return;
  }

  testBtn.disabled = true;
  testBtn.innerText = "測試進行中...";

  for (let i = 1; i <= times; i++) {
    const payload = {
      access_key: ACCESS_KEY,
      name: "自動測試員 " + i,
      email: TEST_EMAIL,
      message: "第 " + i + " 次自動測試郵件"
    };

    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      
      if (response.ok && result.success) {
        console.log(`✅ 第 ${i} 次測試成功:`, result);
      } else {
        console.error(`❌ 第 ${i} 次伺服器拒絕:`, result);
      }

      // 每次測試間隔 1.5 秒，避免觸發 Rate Limit
      if (i < times) {
        await new Promise(resolve => setTimeout(resolve, 1500));
      }
    } catch (err) {
      console.error(`⚠️ 第 ${i} 次網路/CORS 錯誤:`, err);
    }
  }

  testBtn.disabled = false;
  testBtn.innerText = "開始自動測試";
  alert("測試完畢！請按 F12 打開 Console 查看詳細結果，並至您的信箱 Check 是否收到信。");
}
</script>

</body>
</html>
