<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡表單測試</title>
  <!-- 防範 favicon.ico 404 報錯 -->
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .form-container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    .test-panel {
      margin-top: 25px;
      border-top: 1px solid #444;
      padding-top: 20px;
    }
    .test-panel input {
      margin-bottom: 15px;
    }
    #testBtn {
      background: #28a745;
    }
    #testBtn:hover {
      background: #1e7e34;
    }
    #testBtn:disabled {
      background: #555555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>聯絡我們</h2>
    
    <!-- 一般HTML表單送出 -->
    <form action="https://api.web3forms.com/submit" method="POST">
      <!-- ⚠️請替換為您從 Web3Forms 申請到的 Key -->
      <input type="hidden" name="access_key" value="81b74347-9220-48a3-81da-28620c7ef4d6">

      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" required placeholder="請輸入姓名">
      </div>

      <div class="form-group">
        <label for="email">電子郵件</label>
        <input type="email" id="email" name="email" required placeholder="請輸入 Email">
      </div>

      <div class="form-group">
        <label for="message">訊息內容</label>
        <textarea id="message" name="message" rows="4" required placeholder="請輸入您的訊息..."></textarea>
      </div>

      <button type="submit">確認送出</button>
    </form>

    <!-- JS 測試區塊 -->
    <div class="test-panel">
      <label for="count">測試送出次數 (建議 1~5 次)</label>
      <input type="number" id="count" value="3" min="1" max="10">

      <button type="button" id="testBtn" onclick="sendTest()">
        開始測試
      </button>
    </div>
  </div>

<script>
async function sendTest() {
  const countInput = document.getElementById("count");
  const testBtn = document.getElementById("testBtn");
  const times = parseInt(countInput.value, 10);

  // 請更換為您個人的真實 Key 與可接收信件的 Email
  const ACCESS_KEY = "81b74347-9220-48a3-81da-28620c7ef4d6"; 
  const TEST_EMAIL = "1140060@gm.yhh.tn.edu.tw"; 

  if (isNaN(times) || times < 1 || times > 10) {
    alert("請輸入 1～10 之間的數字");
    return;
  }

  testBtn.disabled = true;
  testBtn.innerText = "測試進行中...";

  for (let i = 1; i <= times; i++) {
    // 建立 JSON Payload
    const payload = {
      access_key: ACCESS_KEY,
      name: "測試使用者 " + i,
      email: TEST_EMAIL,
      message: "第 " + i + " 次自動測試發送"
    };

    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      
      if (response.ok && result.success) {
        console.log(`✅ 第 ${i} 次發送成功:`, result);
      } else {
        console.error(`❌ 第 ${i} 次伺服器回傳失敗:`, result);
      }

      // 每次請求間隔 1 秒，防止觸發速率限制 (Rate Limit)
      if (i < times) {
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    } catch (err) {
      console.error(`⚠️ 第 ${i} 次網路或 CORS 錯誤:`, err);
    }
  }

  testBtn.disabled = false;
  testBtn.innerText = "開始測試";
  alert("測試完成！請查看瀏覽器 Console (F12) 的詳細紀錄。");
}
</script>

</body>
</html>
