<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡表單測試</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .form-container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }
    .test-panel {
      margin-top: 25px;
      border-top: 1px solid #444;
      padding-top: 20px;
    }
    .test-panel input {
      margin-bottom: 15px;
    }
    #testBtn {
      background: #28a745;
    }
    #testBtn:hover {
      background: #1e7e34;
    }
    .note {
      font-size: 0.8rem;
      color: #888;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>聯絡我們</h2>
    
    <!-- 改用原生 HTML 表單直接 POST 到 Web3Forms (100% 避開 CORS 限制) -->
    <form action="https://api.web3forms.com/submit" method="POST">
      
      <!-- Web3Forms 必要的 Access Key -->
      <input type="hidden" name="access_key" value="81b74347-9220-48a3-81da-28620c7ef4d6">

      <!-- 送出成功後跳轉回原網頁（可自訂） -->
      <input type="hidden" name="redirect" value="https://1140060-ui.github.io">

      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" required placeholder="請輸入姓名">
      </div>

      <div class="form-group">
        <label for="email">電子郵件</label>
        <input type="email" id="email" name="email" required placeholder="請輸入 Email">
      </div>

      <div class="form-group">
        <label for="message">訊息內容</label>
        <textarea id="message" name="message" rows="4" required placeholder="請輸入您的訊息..."></textarea>
      </div>

      <button type="submit">確認送出</button>
    </form>

    <!-- JS 測試區塊（保留給後台自動測試） -->
    <div class="test-panel">
      <label for="count">批量測試發送次數 (1~5 次)</label>
      <input type="number" id="count" value="1" min="1" max="5">

      <button type="button" id="testBtn" onclick="sendTest()">
        開始自動測試
      </button>
      <p class="note">※ 自動測試若受學校防火牆或外掛影響，請優先使用上方主表單送出。</p>
    </div>
  </div>

<script>
const ACCESS_KEY = "81b74347-9220-48a3-81da-28620c7ef4d6"; 
const TEST_EMAIL = "1140060@gm.yhh.tn.edu.tw";

// 批量自動測試功能
async function sendTest() {
  const countInput = document.getElementById("count");
  const testBtn = document.getElementById("testBtn");
  const times = parseInt(countInput.value, 10);

  if (isNaN(times) || times < 1 || times > 5) {
    alert("請輸入 1～5 之間的數字");
    return;
  }

  testBtn.disabled = true;
  testBtn.innerText = "測試進行中...";

  for (let i = 1; i <= times; i++) {
    const formData = new FormData();
    formData.append("access_key", ACCESS_KEY);
    formData.append("name", "自動測試員 " + i);
    formData.append("email", TEST_EMAIL);
    formData.append("message", "第 " + i + " 次自動測試郵件");

    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: formData
      });

      const result = await response.json();
      
      if (response.ok && result.success) {
        console.log(`✅ 第 ${i} 次測試成功:`, result);
      } else {
        console.error(`❌ 第 ${i} 次伺服器拒絕:`, result);
      }

      if (i < times) {
        await new Promise(resolve => setTimeout(resolve, 1500));
      }
    } catch (err) {
      console.error(`⚠️ 第 ${i} 次網路/CORS 錯誤:`, err);
    }
  }

  testBtn.disabled = false;
  testBtn.innerText = "開始自動測試";
  alert("測試完畢！請檢查 console 控制台紀錄與學校信箱。");
}
</script>

</body>
</html>
