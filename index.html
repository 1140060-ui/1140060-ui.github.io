<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡表單測試</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .form-container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }
    .test-panel {
      margin-top: 25px;
      border-top: 1px solid #444;
      padding-top: 20px;
    }
    .test-panel input {
      margin-bottom: 15px;
    }
    #testBtn {
      background: #28a745;
    }
    #testBtn:hover {
      background: #1e7e34;
    }
    .status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
      font-size: 0.9rem;
      text-align: center;
    }
    .status-msg.success {
      background-color: #1e4620;
      color: #75b798;
    }
    .status-msg.error {
      background-color: #491217;
      color: #ea868f;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>聯絡我們</h2>
    
    <!-- 一般聯絡表單 -->
    <form id="contactForm">
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" required placeholder="請輸入姓名">
      </div>

      <div class="form-group">
        <label for="email">電子郵件</label>
        <input type="email" id="email" name="email" required placeholder="請輸入 Email">
      </div>

      <div class="form-group">
        <label for="message">訊息內容</label>
        <textarea id="message" name="message" rows="4" required placeholder="請輸入您的訊息..."></textarea>
      </div>

      <button type="submit" id="submitBtn">確認送出</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>

    <!-- JS 測試區塊 -->
    <div class="test-panel">
      <label for="count">批量測試發送次數 (1~5 次)</label>
      <input type="number" id="count" value="1" min="1" max="5">

      <button type="button" id="testBtn" onclick="sendTest()">
        開始自動測試
      </button>
    </div>
  </div>

<script>
// 綁定您的專屬 Key 與信箱
const ACCESS_KEY = "81b74347-9220-48a3-81da-28620c7ef4d6"; 
const TEST_EMAIL = "1140060@gm.yhh.tn.edu.tw";

// 1. 處理手動填寫表單送出（改用 FormData 格式，防範 CORS 攔截）
document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("statusMsg");
  
  submitBtn.disabled = true;
  submitBtn.innerText = "傳送中...";
  statusMsg.style.display = "none";

  // 使用 FormData 包裝資料
  const formData = new FormData();
  formData.append("access_key", ACCESS_KEY);
  formData.append("name", document.getElementById("name").value);
  formData.append("email", document.getElementById("email").value);
  formData.append("message", document.getElementById("message").value);

  try {
    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      body: formData
    });

    const result = await response.json();

    if (response.ok && result.success) {
      statusMsg.className = "status-msg success";
      statusMsg.innerText = "🎉 訊息發送成功！我們將盡快回覆您。";
      document.getElementById("contactForm").reset();
    } else {
      statusMsg.className = "status-msg error";
      statusMsg.innerText = "❌ 發送失敗：" + (result.message || "伺服器拒絕發送");
    }
  } catch (err) {
    statusMsg.className = "status-msg error";
    statusMsg.innerText = "⚠️ 網路連線或 CORS 錯誤，請檢查廣告攔截器是否開啟。";
    console.error("發送出錯:", err);
  } finally {
    statusMsg.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.innerText = "確認送出";
  }
});

// 2. 批量自動測試功能（使用 FormData 格式）
async function sendTest() {
  const countInput = document.getElementById("count");
  const testBtn = document.getElementById("testBtn");
  const times = parseInt(countInput.value, 10);

  if (isNaN(times) || times < 1 || times > 5) {
    alert("請輸入 1～5 之間的數字");
    return;
  }

  testBtn.disabled = true;
  testBtn.innerText = "測試進行中...";

  for (let i = 1; i <= times; i++) {
    const formData = new FormData();
    formData.append("access_key", ACCESS_KEY);
    formData.append("name", "自動測試員 " + i);
    formData.append("email", TEST_EMAIL);
    formData.append("message", "第 " + i + " 次自動測試郵件");

    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: formData
      });

      const result = await response.json();
      
      if (response.ok && result.success) {
        console.log(`✅ 第 ${i} 次測試成功:`, result);
      } else {
        console.error(`❌ 第 ${i} 次伺服器拒絕:`, result);
      }

      if (i < times) {
        await new Promise(resolve => setTimeout(resolve, 1500));
      }
    } catch (err) {
      console.error(`⚠️ 第 ${i} 次網路/CORS 錯誤:`, err);
    }
  }

  testBtn.disabled = false;
  testBtn.innerText = "開始自動測試";
  alert("測試完畢！請檢查 console 控制台紀錄與學校信箱。");
}
</script>

</body>
</html>
